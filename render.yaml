services:
  - type: web
    name: earth-pulse-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: EARTH_PULSE_CORS_ORIGINS
        sync: false
      - key: EARTH_PULSE_CACHE_PATH
        value: /tmp/earth-pulse-cache.sqlite3
